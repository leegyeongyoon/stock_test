version: '3.8'

services:
  api:
    build: ./server
    container_name: trading-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/trading.db
      - ENABLE_LIVE_TRADING=false
      - LOG_LEVEL=INFO
    env_file:
      - ./server/.env
    volumes:
      - ./data:/app/data
      - ./server/src:/app/src:ro  # 개발용 핫리로드
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build: ./dashboard
    container_name: trading-dashboard
    ports:
      - "3005:3005"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: trading-network
